<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리학교 통합 자료실</title>
  <style>
    /* 전체 배경 및 폰트 설정 */
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f5f7fb;
      margin: 0;
      padding: 20px;
      color: #333;
      user-select: none; /* 드래그 방지 */
    }

    /* 상단 헤더 및 필터 영역 */
    .header-container {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      text-align: center;
    }
    h1 { color: #2c3e50; }
    .filter-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap; /* 모바일 등 좁은 화면에서 줄바꿈 */
      gap: 15px;
      margin-top: 20px;
    }
    select, input[type="text"] {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }
    select { cursor: pointer; }
    input[type="text"] {
      width: 200px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #4a90e2;
    }

    /* 게시판(갤러리) 그리드 레이아웃 */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 개별 자료 카드 디자인 */
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    /* 썸네일 대체 영역 */
    .card-thumbnail {
      height: 160px;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: rgba(255,255,255,0.8);
    }

    /* 카드 내용 영역 */
    .card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .tags {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .tag-grade { background-color: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 4px; }
    .tag-subject { background-color: #f3e5f5; color: #7b1fa2; padding: 4px 8px; border-radius: 4px; }
    
    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 10px 0;
      line-height: 1.4;
    }
    .card-topic {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
      flex-grow: 1;
    }
    .card-author {
      font-size: 13px;
      color: #999;
      margin-bottom: 15px;
      text-align: right;
    }

    /* 링크 버튼 */
    .btn-link {
      display: block;
      text-align: center;
      background-color: #4a90e2;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-link:hover { background-color: #357abd; }

    /* 로딩 및 검색결과 없음 표시 */
    .status-msg { text-align: center; font-size: 20px; color: #666; margin-top: 50px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>📚 우리학교 통합 자료실</h1>
    <div class="filter-group">
      <select id="gradeFilter">
        <option value="all">전체 학년</option>
      </select>
      <select id="subjectFilter">
        <option value="all">전체 과목</option>
      </select>
      <!-- 주제 검색창 추가 -->
      <input type="text" id="topicSearch" placeholder="주제 검색...">
    </div>
  </div>

  <div id="loading" class

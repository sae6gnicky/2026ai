<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 은명초 AI 선도학교 자료실</title>
  <style>
    /* 세련된 컬러 팔레트 변수 설정 */
    :root {
      --theme-navy: #2B3A4C; 
      --theme-beige: #EAE6DF; 
      --theme-white: #FFFFFF;
      --btn-blue: #4A90E2;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #D1D5DB; /* 화면 밖 바탕화면 색상 */
      margin: 0;
      padding: 0;
      color: #333;
      user-select: none; /* 드래그 방지 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* 대문이 떠있을 때 스크롤 방지 */
    }

    /* =========================================
       1. 대문 (스플래시 스크린) 디자인 
       ========================================= */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #008080; /* 레트로 윈도우 바탕화면 느낌의 청록색 */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out; /* 부드럽게 사라지는 효과 */
    }

    .splash-dialog {
      background-color: var(--theme-beige);
      border: 4px solid var(--theme-navy);
      box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
      width: 450px;
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    .splash-titlebar {
      background-color: var(--theme-navy);
      color: white;
      padding: 8px 12px;
      font-weight: bold;
      text-align: left;
      display: flex;
      justify-content: space-between;
      letter-spacing: 1px;
    }

    .splash-content {
      padding: 40px 30px;
      font-size: 1.3rem;
      line-height: 1.6;
      color: var(--theme-navy);
      font-weight: 800;
    }

    .splash-btn {
      background-color: var(--btn-blue);
      color: white;
      border: 2px solid #111;
      padding: 12px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 3px 3px 0 #111;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .splash-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0 #111;
    }

    /* =========================================
       2. 메인 자료실 영역 (처음엔 숨겨둠) 
       ========================================= */
    #main-app {
      display: none; /* 대문에서 입장하기를 누르기 전까지 숨김 */
      width: 100%;
      height: 100vh;
      padding: 3vh 3vw;
      box-sizing: border-box;
      justify-content: center;
      align-items: center;
    }

    /* 레트로 윈도우 창 프레임 */
    .os-window {
      width: 100%;
      max-width: 1400px;
      height: 94vh;
      background-color: var(--theme-beige);
      border: 6px solid var(--theme-navy);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 10px 30px rgba(0,0,0,0.2);
    }

    .os-titlebar {
      background-color: var(--theme-navy);
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .os-btn {
      width: 30px; height: 30px;
      background-color: var(--theme-beige);
      border: 2px solid #111;
      display: flex; justify-content: center; align-items: center;
      font-weight: bold; color: #111; cursor: default;
      box-shadow: 2px 2px 0 #111;
    }
    
    .os-btn-group { display: flex; gap: 5px; }

    .os-content {
      padding: 40px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .header-container { text-align: center; margin-bottom: 40px; }

    h1 { 
      color: var(--theme-navy); font-size: 3.5rem; font-weight: 900;
      letter-spacing: -2px; margin: 0 0 20px 0;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
    }

    .filter-wrapper {
      background-color: var(--theme-white);
      padding: 15px 30px;
      display: inline-flex;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .filter-group { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 15px; }

    select {
      padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd;
      font-size: 16px; outline: none; cursor: pointer; background-color: #f9f9f9;
    }

    .search-box { position: relative; display: flex; align-items: center; }
    .search-box input[type="text"] {
      padding: 10px 15px 10px 40px; border-radius: 50px; border: 1px solid #ccc;
      font-size: 16px; outline: none; width: 200px; transition: border-color 0.2s;
    }
    .search-box input[type="text"]:focus { border-color: var(--theme-navy); }
    .search-icon { position: absolute; left: 12px; font-size: 18px; pointer-events: none; }

    .gallery-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px; max-width: 1200px; margin: 0 auto;
    }

    .card {
      background: var(--theme-white); border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

    .card-thumbnail {
      height: 160px; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; color: rgba(255,255,255,0.8);
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }

    .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
    .tags { display: flex; gap: 8px; margin-bottom: 12px; font-size: 12px; font-weight: bold; }
    .tag-grade { background-color: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 4px; }
    .tag-subject { background-color: #f3e5f5; color: #7b1fa2; padding: 4px 8px; border-radius: 4px; }
    
    .card-title { font-size: 18px; font-weight: bold; margin: 0 0 10px 0; line-height: 1.4; color: var(--theme-navy); }
    .card-topic { font-size: 14px; color: #666; margin-bottom: 15px; flex-grow: 1; }
    .card-author { font-size: 13px; color: #999; margin-bottom: 15px; text-align: right; }

    .btn-link {
      display: block; text-align: center; background-color: var(--btn-blue);
      color: white; text-decoration: none; padding: 12px; border-radius: 8px;
      font-weight: bold; transition: background 0.2s;
    }
    .btn-link:hover { background-color: #357abd; }
    .status-msg { text-align: center; font-size: 20px; color: #666; margin-top: 50px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- 🚪 1. 대문 (스플래시 스크린) 영역 -->
  <div id="splash-screen">
    <div class="splash-dialog">
      <div class="splash-titlebar">
        <span>System Alert</span>
        <span>✕</span>
      </div>
      <div class="splash-content">
        📁 2026 은명초 AI 선도학교 자료실에<br>입장하시겠습니까?
        <br>
        <button id="enterBtn" class="splash-btn">입장하기 ↵</button>
      </div>
    </div>
  </div>

  <!-- 📂 2. 메인 자료실 영역 (처음엔 안 보임) -->
  <div id="main-app">
    <div class="os-window">
      <div class="os-titlebar">
        <div class="os-btn">∨</div>
        <div class="os-btn-group">
          <div class="os-btn">─</div>
          <div class="os-btn">□</div>
          <div class="os-btn">✕</div>
        </div>
      </div>

      <div class="os-content">
        <div class="header-container">
          <h1>2026 은명초 AI 선도학교 자료실</h1>
          <div class="filter-wrapper">
            <div class="filter-group">
              <select id="gradeFilter"><option value="all">전체 학년</option></select>
              <select id="subjectFilter"><option value="all">전체 과목</option></select>
              <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="topicSearch" placeholder="주제 검색...">
              </div>
            </div>
          </div>
        </div>

        <div id="loading" class="status-msg">자료를 불러오는 중입니다...⏳</div>
        <div id="gallery" class="gallery-container"></div>
      </div>
    </div>
  </div>

  <script>
    // 🔒 1. 보안 스크립트 (우클릭 및 키보드 단축키 완벽 차단)
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if (event.keyCode === 123 || 
         (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74)) || 
         (event.ctrlKey && (event.keyCode === 85 || event.keyCode === 67 || event.keyCode === 86 || event.keyCode === 80))) { 
        event.preventDefault();
      }
    });

    // 🚀 2. 대문 입장 버튼 이벤트 (누르면 대문이 사라지고 자료실이 뜸)
    document.getElementById('enterBtn').addEventListener('click', function() {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0'; // 부드럽게 투명해짐
      
      setTimeout(() => {
        splash.style.display = 'none'; // 완전히 숨김
        document.getElementById('main-app').style.display = 'flex'; // 자료실 표시
        document.body.style.overflow = 'auto'; // 스크롤 활성화
      }, 300); // 0.3초 대기
    });

    // 💾 3. 백그라운드 데이터 프리패치 (대문이 떠있는 동안 몰래 실행됨)
    const API_URL = "https://script.google.com/macros/s/AKfycbymCDFt8lojL8DHE9ULHzpP6d9NCoiRpcb0HOwexP6Fx6wHeSzyNEXm05ZL7vZZsUx2/exec";
    let allData = [];

    const cacheBuster = "?t=" + new Date().getTime(); 
    fetch(API_URL + cacheBuster)
      .then(response => response.json())
      .then(data => {
        allData = data.reverse(); 
        document.getElementById('loading').style.display = 'none'; // 데이터 도착 시 로딩 글씨 삭제
        
        populateFilters(); 
        renderGallery(allData); 
      })
      .catch(error => {
        document.getElementById('loading').innerText = "데이터를 불러오는데 실패했습니다. 주소를 다시 확인해주세요.";
      });

    // 필터 옵션 채우기
    function populateFilters() {
      const grades = new Set();
      const subjects = new Set();

      allData.forEach(item => {
        if(item['몇 학년 용인가요?']) grades.add(item['몇 학년 용인가요?']);
        if(item['과목은 무엇인가요?']) subjects.add(item['과목은 무엇인가요?']);
      });

      const gradeFilter = document.getElementById('gradeFilter');
      grades.forEach(g => {
        const option = document.createElement('option');
        option.value = g; option.innerText = g;
        gradeFilter.appendChild(option);
      });

      const subjectFilter = document.getElementById('subjectFilter');
      subjects.forEach(s => {
        const option = document.createElement('option');
        option.value = s; option.innerText = s;
        subjectFilter.appendChild(option);
      });
    }

    // 갤러리 그리기
    function renderGallery(data) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = ''; 

      if (data.length === 0) {
        gallery.innerHTML = '<div class="status-msg">조건에 맞는 자료가 없습니다. 텅~</div>';
        return;
      }

      data.forEach(item => {
        const titleKey = Object.keys(item).find(k => k.includes('이름') && !k.includes('선생님')) || '';
        const title = titleKey && item[titleKey] ? item[titleKey] : '제목 없음';
        
        const grade = item['몇 학년 용인가요?'] || '공통';
        const subject = item['과목은 무엇인가요?'] || '공통';
        
        const topicKey = Object.keys(item).find(k => k.includes('주제')) || '';
        const topic = topicKey ? item[topicKey] : '';
        
        const authorKey = Object.keys(item).find(k => k.includes('선생님')) || '';
        const author = authorKey ? item[authorKey] : '익명';

        const fileKey = Object.keys(item).find(k => k.includes('업로드') && !k.includes('썸네일')) || '';
        const linkKey = Object.keys(item).find(k => k.includes('링크')) || '';
        let linkUrl = item[fileKey] || item[linkKey] || '#';

        const thumbKey = Object.keys(item).find(k => k.includes('썸네일')) || '';
        let thumbHtml = `<div class="card-thumbnail">${subject}</div>`; 
        
        if (thumbKey && item[thumbKey]) {
          const fileUrls = item[thumbKey].toString().split(',')[0].trim();
          const fileIdMatch = fileUrls.match(/id=([^&]+)/) || fileUrls.match(/d\/([a-zA-Z0-9-_]+)/);
          
          if (fileIdMatch && fileIdMatch[1]) {
            const imageSrc = `https://drive.google.com/thumbnail?id=${fileIdMatch[1]}&sz=w600`;
            thumbHtml = `<div class="card-thumbnail" style="background-image: url('${imageSrc}'); color: transparent;"></div>`;
          }
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${thumbHtml}
          <div class="card-content">
            <div class="tags">
              <span class="tag-grade">${grade}</span>
              <span class="tag-subject">${subject}</span>
            </div>
            <h3 class="card-title">${title}</h3>
            <div class="card-topic">📝 ${topic}</div>
            <div class="card-author">올린이: ${author}</div>
            <a href="${linkUrl}" target="_blank" class="btn-link" ${linkUrl === '#' ? 'style="background:#ccc; cursor:not-allowed;" onclick="return false;"' : ''}>
              ${linkUrl === '#' ? '링크 없음' : '자료 열기'}
            </a>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    // 필터링 및 검색
    function filterData() {
      const selectedGrade = document.getElementById('gradeFilter').value;
      const selectedSubject = document.getElementById('subjectFilter').value;
      const searchKeyword = document.getElementById('topicSearch').value.toLowerCase().trim();

      const filtered = allData.filter(item => {
        const matchGrade = selectedGrade === 'all' || item['몇 학년 용인가요?'] === selectedGrade;
        const matchSubject = selectedSubject === 'all' || item['과목은 무엇인가요?'] === selectedSubject;
        
        const topicKey = Object.keys(item).find(k => k.includes('주제')) || '';
        const topicText = topicKey && item[topicKey] ? String(item[topicKey]).toLowerCase() : '';
        const titleKey = Object.keys(item).find(k => k.includes('이름') && !k.includes('선생님')) || '';
        const titleText = titleKey && item[titleKey] ? String(item[titleKey]).toLowerCase() : '';
        
        const matchKeyword = searchKeyword === '' || topicText.includes(searchKeyword) || titleText.includes(searchKeyword);

        return matchGrade && matchSubject && matchKeyword;
      });

      renderGallery(filtered);
    }

    document.getElementById('gradeFilter').addEventListener('change', filterData);
    document.getElementById('subjectFilter').addEventListener('change', filterData);
    document.getElementById('topicSearch').addEventListener('input', filterData);

  </script>
</body>
</html>
